[tool.poetry]
name = "streamstats"
version = "1.0.0"
description = "smth do"
authors = ["Вершков Савва"]
packages = [{include = "streamstats", from = "src"}]


[tool.poetry.dependencies]
python = "~3.13"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.5.0"
black = "^25.11.0"
ruff="^0.14.7"
mypy = "^1.19.0"
pytest = "^8.3.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.black]
line-length = 120
target-version = ['py313']


[tool.ruff]
fix = false
target-version = "py313"
line-length = 120


[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 120


[tool.ruff.lint.isort]
case-sensitive = true
force-single-line=true
lines-between-types = 1
no-sections = false

[tool.pytest.ini_options]
pythonpath = ["src"]